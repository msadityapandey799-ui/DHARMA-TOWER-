@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#171613;--sf:#201e1b;--ink:#f0e9d9;--mut:#a89f8d;--ln:#38342d;--gd:#d1b877}}
:root[data-theme="dark"]{--bg:#171613;--sf:#201e1b;--ink:#f0e9d9;--mut:#a89f8d;--ln:#38342d;--gd:#d1b877}
*,*:before,*:after{box-sizing:inherit}html{scroll-behavior:smooth}
body{margin:0;background:var(--bg);color:var(--ink);font:17px/1.65 Jost,system-ui,sans-serif}
h1,h2,h3{font-family:'Cormorant Garamond',Georgia,serif;font-weight:400;line-height:1.05;margin:0 0 .5em}
h1{font-size:clamp(2.8rem,8vw,6rem);letter-spacing:-.01em}h2{font-size:clamp(2rem,5vw,3.4rem)}h3{font-size:1.7rem}
a{color:inherit}.wrap{max-width:1200px;margin:0 auto;padding:0 22px}.sec{padding:clamp(56px,9vw,120px) 0}.sf{background:var(--sf)}
header{position:fixed;top:env(safe-area-inset-top,0px);left:0;right:0;z-index:30;transition:background .35s,box-shadow .35s,color .35s;color:#f6f1e7}
header.solid{background:#1d1c1a;box-shadow:0 6px 30px #0004}
.nav{display:flex;align-items:center;justify-content:space-between;height:76px}
.logo{font:600 1.6rem 'Cormorant Garamond',serif;letter-spacing:.16em;text-decoration:none}.logo i{color:var(--gold);font-style:normal}.logo{display:inline-flex;align-items:center;gap:12px}.lm{height:40px;width:auto;display:block}
nav{display:flex;gap:30px;align-items:center}nav a{text-decoration:none;font-size:.95rem;position:relative}nav a:not(.btn):after{content:"";position:absolute;left:0;bottom:-4px;height:1px;width:0;background:var(--gold);transition:width .3s}nav a:hover:after,nav a.on:after{width:100%}
#mb{display:none;background:none;border:0;color:inherit;font:inherit;padding:8px}
@media(max-width:860px){#mb{display:block}nav{position:fixed;inset:0;background:var(--ch);flex-direction:column;justify-content:center;gap:26px;transform:translateY(-100%);visibility:hidden;transition:transform .45s cubic-bezier(.7,0,.2,1),visibility 0s .45s}nav.open{transform:none;visibility:visible;transition-delay:0s}nav a:not(.btn){font:400 2.2rem 'Cormorant Garamond',serif}#mb{position:relative;z-index:2}}
.btn{display:inline-block;background:var(--gold);color:#1d1c1a;border:1px solid var(--gold);padding:13px 28px;border-radius:99px;font:500 .95rem Jost,sans-serif;text-decoration:none;cursor:pointer;transition:transform .25s,background .25s,color .25s}
.btn:hover{transform:translateY(-2px);background:#cbb274}.btn.g{background:transparent;color:inherit;border-color:currentColor}.btn.g:hover{background:#ffffff18}.btn.d{background:var(--ch);color:#f6f1e7;border-color:var(--ch)}.btn.sm{padding:9px 20px;font-size:.88rem}
.btn.o{background:transparent;color:var(--ink);border-color:var(--ln)}.btn.o:hover{border-color:var(--gold)}
:focus-visible{outline:3px solid var(--gold);outline-offset:3px}
.hero{position:relative;min-height:100svh;display:flex;align-items:flex-end;background:var(--ch);color:#f6f1e7;overflow:hidden}
.hbg{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;animation:kb 24s ease-out forwards}@keyframes kb{from{transform:scale(1.12)}to{transform:scale(1)}}
.hshade{position:absolute;inset:0;background:linear-gradient(180deg,#1d1c1a99,#1d1c1a33 40%,#1d1c1acc)}
.hc{position:relative;padding-bottom:90px;padding-top:140px}.hc>*{animation:up .9s both}.hc p{animation-delay:.2s;font-size:1.25rem;max-width:34ch;color:#e6dcc4}.hc .cta{animation-delay:.4s}
@keyframes up{from{opacity:0;transform:translateY(24px)}}.cta{display:flex;flex-wrap:wrap;gap:14px;margin-top:30px}
.dm{position:absolute;right:16px;top:calc(env(safe-area-inset-top,0px) + 90px);font-size:.75rem;color:#e6dcc4aa}
.sp{position:relative;margin:-64px auto 0;z-index:5;max-width:1000px;background:var(--sf);border-radius:20px;box-shadow:0 24px 60px #0003;padding:24px;display:grid;grid-template-columns:repeat(3,1fr) auto;gap:14px;align-items:end}
@media(max-width:760px){.sp{grid-template-columns:1fr;margin:-48px 14px 0}}
label{display:block;font-size:.82rem;color:var(--mut);margin-bottom:4px}
input,select,textarea{width:100%;padding:12px 14px;border:1px solid var(--ln);border-radius:10px;font:inherit;background:var(--bg);color:var(--ink)}
.fg{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:26px}
.fc{position:relative;display:flex;flex-direction:column;border-radius:20px;overflow:hidden;background:var(--sf);box-shadow:0 10px 30px #0001;transition:box-shadow .35s,transform .35s}.fc:hover{box-shadow:0 22px 50px #0003;transform:translateY(-4px)}
.im{position:relative;overflow:hidden;aspect-ratio:4/5}.im img{width:100%;height:100%;object-fit:cover;display:block;transition:transform .8s}.fc:hover .im img{transform:scale(1.06)}
.im:after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,transparent 50%,#1d1c1acc)}
.im h3{position:absolute;left:20px;bottom:6px;z-index:1;color:#fff;margin:0}.im .tg{position:absolute;z-index:1;top:14px;left:14px;display:flex;gap:6px;flex-wrap:wrap}
.tg span{font-size:.75rem;background:#1d1c1acc;color:#f6f1e7;padding:3px 11px;border-radius:99px}.tg .v{background:var(--gold);color:#1d1c1a}
.cb{padding:20px;display:flex;flex-direction:column;gap:6px;flex:1}.pr{font:600 1.8rem 'Cormorant Garamond',serif;color:var(--gd)}.pr small{font:400 .85rem Jost;color:var(--mut)}
.mt{color:var(--mut);font-size:.9rem}.acts{display:flex;gap:8px;flex-wrap:wrap;margin-top:auto;padding-top:12px}
.why{display:grid;grid-template-columns:1fr 1.2fr;gap:clamp(30px,6vw,90px)}@media(max-width:820px){.why{grid-template-columns:1fr}}
.why dl{margin:0}.why dt{font:400 1.7rem 'Cormorant Garamond',serif;padding-top:22px;border-top:1px solid var(--ln)}.why dd{margin:4px 0 22px;color:var(--mut)}
.mas{columns:3 260px;column-gap:16px}.mas figure{margin:0 0 16px;break-inside:avoid;position:relative;overflow:hidden;border-radius:16px;cursor:zoom-in}
.mas img{width:100%;display:block;object-fit:cover;transition:transform .7s}.mas figure:hover img{transform:scale(1.05)}
.mas figcaption{position:absolute;left:14px;bottom:10px;color:#f6f1e7;font-size:.88rem;text-shadow:0 1px 8px #000}
.ed{display:grid;grid-template-columns:repeat(4,1fr);grid-auto-rows:190px;gap:14px}.ed figure{margin:0;border-radius:16px;overflow:hidden;cursor:zoom-in;position:relative}.ed figure:first-child{grid-column:span 2;grid-row:span 2}.ed img{width:100%;height:100%;object-fit:cover;transition:transform .7s}.ed figure:hover img{transform:scale(1.06)}
@media(max-width:700px){.ed{grid-template-columns:1fr 1fr}}
.two{display:grid;grid-template-columns:1.1fr 1fr;gap:clamp(28px,5vw,70px);align-items:start}@media(max-width:860px){.two{grid-template-columns:1fr}}
.f2{display:grid;grid-template-columns:1fr;gap:14px}.f2 .full{grid-column:1/-1}@media(max-width:560px){.f2{grid-template-columns:1fr}}
.er{color:#c0392b;font-size:.8rem;min-height:1.1em}[aria-invalid=true]{border-color:#c0392b}.hp{position:absolute;left:-9999px}
.ok,.bad{border-radius:12px;padding:16px;margin-top:14px;font-size:.95rem}.ok{background:#e6f1e4;color:#1f4d27}.bad{background:#f8e4dd;color:#7a2a12}
.pn{background:var(--sf);border-radius:20px;padding:28px;box-shadow:0 10px 30px #0001}
.map{min-height:320px;border-radius:20px;background:linear-gradient(135deg,var(--ch),#3a352c);color:#e6dcc4;display:grid;place-items:center;text-align:center;padding:26px}
.ph{background:#b59a5b22;border:1px dashed var(--gold);border-radius:6px;padding:0 8px;font-size:.88rem}
.pg{padding-top:130px}.gal{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}.gal img{width:100%;border-radius:14px;aspect-ratio:4/3;object-fit:cover;cursor:zoom-in}.gal img:first-child{grid-column:1/-1;aspect-ratio:16/9}
ul.am{list-style:none;padding:0;columns:2 200px}ul.am li:before{content:"— ";color:var(--gold)}
footer{background:var(--ch);color:#cfc6b2;padding:60px 0 30px}footer a{display:block;text-decoration:none;margin:5px 0}footer a:hover{color:var(--gold)}.fgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:30px}
#wa{position:fixed;right:18px;bottom:calc(18px + env(safe-area-inset-bottom,0px));z-index:25;background:#25d366;color:#fff;border-radius:99px;padding:13px 20px;text-decoration:none;font-weight:500;box-shadow:0 10px 26px #0005;transition:transform .25s}#wa:hover{transform:scale(1.05)}
dialog{border:0;background:transparent;max-width:min(1000px,94vw);padding:0;color:#fff}dialog::backdrop{background:#000d}dialog img{width:100%;border-radius:12px}.lbn{display:flex;justify-content:space-between;align-items:center;margin-top:10px}.lbn button{background:#ffffff22;color:#fff;border:0;border-radius:99px;padding:8px 18px;cursor:pointer;font:inherit}
.rv{opacity:0;transform:translateY(18px);transition:opacity .8s,transform .8s}.rv.in{opacity:1;transform:none}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}.rv{opacity:1;transform:none}html{scroll-behavior:auto}}

/* ===== CONFIG: leave blank until confirmed. Blank values are hidden and buttons fall back to the enquiry form ===== */
const CONFIG={phone:"",phoneDisplay:"",whatsapp:"",address:"",hours:"",mapEmbedUrl:"",endpoint:""};
/* ===== FLATS: SAMPLE DATA. Replace rents, specs and photos. verified:true only once management confirms availability ===== */
const FLATS=[
{id:"DT-A1",type:"1 BHK",beds:1,baths:1,rent:18000,deposit:36000,furn:"Furnished",area:null,verified:false,photos:[],items:["Bed and wardrobe","Sofa","Kitchen appliances"],desc:"Sample listing. Replace with the real description of this flat."},
{id:"DT-B1",type:"2 BHK",beds:2,baths:2,rent:26000,deposit:52000,furn:"Furnished",area:null,verified:false,photos:[],items:["Two bedrooms with beds","Sofa and dining set","Kitchen appliances"],desc:"Sample listing. Replace with the real description of this flat."},
{id:"DT-C1",type:"3 BHK",beds:3,baths:3,rent:38000,deposit:76000,furn:"Furnished",area:null,verified:false,photos:[],items:["Three bedrooms with beds","Living and dining furniture","Kitchen appliances"],desc:"Sample listing. Replace with the real description of this flat."},
{id:"DT-A2",type:"1 BHK",beds:1,baths:1,rent:15000,deposit:30000,furn:"Semi-furnished",area:null,verified:false,photos:[],items:["Wardrobe","Modular kitchen"],desc:"Sample listing. Replace with the real description of this flat."}];
const GALLERY=[{k:"living",l:"Living room"},{k:"bed",l:"Bedroom"},{k:"kitchen",l:"Kitchen"},{k:"bath",l:"Bathroom"},{k:"ext",l:"Building exterior"},{k:"bed",l:"Master bedroom"},{k:"living",l:"Lounge"}]; /* add src:"your-photo.jpg" to any item to use a real photo */
const TERMS=["Lease term: to be confirmed","Notice period: to be confirmed","Maintenance and utilities: to be confirmed"];
const AMEN=[]; /* building facilities: add only when confirmed */
const $=s=>document.querySelector(s),app=$("#app"),S={move:"",beds:"",budget:""};
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const inr=n=>"₹"+Number(n).toLocaleString("en-IN"),tel=()=>CONFIG.phone?"tel:"+CONFIG.phone:"#/contact";
const wa=t=>CONFIG.whatsapp?`https://wa.me/${CONFIG.whatsapp.replace(/\D/g,"")}?text=${encodeURIComponent(t||"Hello, I would like to enquire about a flat at Dharma Tower.")}`:"#/contact";
/* demo imagery: generated illustrations, NOT photographs */
const SC={
living:`<rect x="440" y="80" width="270" height="270" fill="#e8d3a0" opacity=".3"/><circle cx="575" cy="215" r="260" fill="url(#b)"/><ellipse cx="300" cy="500" rx="260" ry="40" fill="#2a2723"/><rect x="100" y="350" width="420" height="120" rx="26" fill="#b59a5b"/><rect x="100" y="305" width="420" height="80" rx="22" fill="#9c8449"/><line x1="660" y1="250" x2="660" y2="480" stroke="#b59a5b" stroke-width="6"/><circle cx="660" cy="235" r="40" fill="url(#b)"/>`,
bed:`<circle cx="400" cy="120" r="200" fill="url(#b)" opacity=".5"/><rect x="140" y="160" width="520" height="190" rx="14" fill="#4a443a"/><rect x="110" y="320" width="580" height="150" rx="20" fill="#e9e1d0"/><rect x="170" y="290" width="210" height="60" rx="14" fill="#f6f1e7"/><rect x="420" y="290" width="210" height="60" rx="14" fill="#f6f1e7"/><rect x="50" y="340" width="50" height="130" fill="#34302a"/><rect x="700" y="340" width="50" height="130" fill="#34302a"/><line x1="400" y1="0" x2="400" y2="60" stroke="#b59a5b" stroke-width="3"/><circle cx="400" cy="70" r="26" fill="url(#b)"/>`,
kitchen:`<rect x="50" y="70" width="700" height="150" fill="#4a443a"/><path d="M200 70v150M350 70v150M500 70v150M650 70v150" stroke="#1d1c1a" stroke-width="3"/><rect x="50" y="320" width="700" height="24" fill="#b59a5b"/><rect x="50" y="344" width="700" height="190" fill="#2a2723"/><g fill="url(#b)"><circle cx="250" cy="260" r="34"/><circle cx="400" cy="260" r="34"/><circle cx="550" cy="260" r="34"/></g>`,
bath:`<circle cx="400" cy="190" r="110" fill="#e9e1d0" opacity=".9"/><circle cx="400" cy="190" r="92" fill="#4a443a"/><circle cx="400" cy="190" r="200" fill="url(#b)" opacity=".4"/><rect x="120" y="370" width="560" height="120" rx="60" fill="#e9e1d0"/><rect x="140" y="385" width="520" height="70" rx="35" fill="#cfc6b2"/><path d="M60 330h680M60 280h680" stroke="#4a443a"/>`,
ext:`<rect x="260" y="50" width="280" height="500" fill="#3a352c" stroke="#b59a5b" stroke-width="2"/><rect x="230" y="545" width="340" height="14" fill="#b59a5b"/><g fill="#e8d3a0">${Array.from({length:36},(_,i)=>`<rect x="${284+(i%6)*40}" y="${74+Math.floor(i/6)*74}" width="22" height="40" opacity="${i%5?.85:.25}"/>`).join("")}</g>`};
const cache={};function img(k,l){const key=k;if(!cache[key]){const t=`<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600"><defs><linearGradient id="a" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#3a352c"/><stop offset="1" stop-color="#1d1c1a"/></linearGradient><radialGradient id="b"><stop offset="0" stop-color="#e8d3a0" stop-opacity=".9"/><stop offset="1" stop-color="#e8d3a0" stop-opacity="0"/></radialGradient></defs><rect width="800" height="600" fill="url(#a)"/>${SC[k]}</svg>`;cache[key]="data:image/svg+xml,"+encodeURIComponent(t)}return cache[key]}
const KS=["living","bed","kitchen","bath"],fph=f=>f.photos.length?f.photos:KS.map(k=>img(k));
const badge=f=>f.verified?`<span class="v">Available</span>`:"";
function card(f){return `<article class="fc rv"><div class="im"><img src="${fph(f)[0]}" alt="${esc(f.type)} furnished flat ${esc(f.id)}, demo image" loading="lazy"><div class="tg"><span>Sample listing</span>${badge(f)}</div><h3>${esc(f.type)} · ${esc(f.id)}</h3></div><div class="cb"><div class="pr">${inr(f.rent)} <small>/ month · sample rent</small></div><div class="mt">${esc(f.furn)} · ${f.beds} bed · ${f.baths} bath · deposit ${inr(f.deposit)}</div><div class="mt">${f.items.map(esc).join(", ")}</div><div class="mt">${f.verified?"":"Availability: ask our team to confirm"}</div><div class="acts"><a class="btn sm d" href="#/flat/${f.id}">View Details</a><a class="btn sm o" href="#/flat/${f.id}?e=1">Enquire Now</a></div></div></article>`}
function figs(list,cls){return list.map((g,i)=>`<figure data-lb="${i}"><img src="${g.src||img(g.k)}" alt="${esc(g.l)}, demo image" loading="lazy" style="${cls?"":`aspect-ratio:${[4/3,3/4,1,4/3,3/4][i%5]}`}"><figcaption>${esc(g.l)}</figcaption></figure>`).join("")}
let LB=[],li=0;const showLb=i=>{li=(i+LB.length)%LB.length;const g=LB[li];$("#lbi").src=g.src||img(g.k);$("#lbi").alt=g.l;$("#lc").textContent=g.l+" ("+(li+1)+"/"+LB.length+")";if(!lb.open)lb.showModal()};
function form(pre){const fl=FLATS.map(f=>`<option ${f.id===pre?"selected":""} value="${f.id}">${f.id} · ${f.type}</option>`).join("");
const f=(n,l,t,x="")=>`<div><label for="${n}">${l}</label><input id="${n}" name="${n}" type="${t}" ${x}><div class="er" id="e_${n}"></div></div>`;
return `<form class="pn f2 enq" novalidate aria-label="Enquiry form"><input type="hidden" name="_t" value="${Date.now()}"><div class="hp" aria-hidden="true"><label>Leave empty<input name="website" tabindex="-1" autocomplete="off"></label></div>
${f("name","Full name *","text",'autocomplete="name"')}${f("phone","Phone number *","tel",'autocomplete="tel" placeholder="10-digit mobile"')}
<div><label for="type">Preferred flat type</label><select id="type" name="type"><option value="">No preference</option><option>1 BHK</option><option>2 BHK</option><option>3 BHK</option></select></div>
${f("budget","Monthly budget (₹)","number",'min="0" step="500" inputmode="numeric"')}
<div><label for="flat">Listing ID</label><select id="flat" name="flat"><option value="">Any</option>${fl}</select></div>
<div class="full"><label for="msg">Message</label><textarea id="msg" name="msg" rows="3"></textarea></div>
<div class="full"><button class="btn" type="submit">Send visit request</button> <a class="btn o callb" href="${tel()}">Call Now</a><div role="status" aria-live="polite" class="res"></div><p class="mt" style="margin:10px 0 0">A visit request is not a reservation. A flat is held only after management confirms with you. No payment is collected here.</p></div></form>`}
async function submit(fm){const d=Object.fromEntries(new FormData(fm)),res=fm.querySelector(".res");let ok=true;
const bad=(k,m)=>{$("#e_"+k).textContent=m;fm.querySelector("#"+k).setAttribute("aria-invalid",!!m);if(m)ok=false};
bad("name",d.name.trim().length<2?"Enter your full name.":"");bad("phone",/^(\+91)?[6-9]\d{9}$/.test(d.phone.replace(/[\s-]/g,""))?"":"Enter a valid 10-digit Indian mobile number.");
bad("budget",d.budget&&d.budget<0?"Enter a valid amount.":"");if(!ok)return;
if(d.website||Date.now()-d._t<2500){res.innerHTML=`<div class="bad">Please review your details and submit again.</div>`;fm.querySelector("[name=_t]").value=Date.now();return}
const rec={name:d.name.trim(),phone:d.phone.trim(),flatType:d.type,budget:d.budget,flat:d.flat,message:d.msg.trim(),status:"new",at:new Date().toISOString()};
if(!CONFIG.endpoint){const t=`Hello, I am ${rec.name}. I would like to visit Dharma Tower${rec.flat?" (flat "+rec.flat+")":""}. Phone: ${rec.phone}.`;res.innerHTML=`<div class="bad"><strong>Not sent.</strong> Online enquiries are not connected to a backend yet, so nothing was delivered to management.${CONFIG.whatsapp||CONFIG.phone?` Please <a href="${wa(t)}">message us on WhatsApp</a> or call ${esc(CONFIG.phoneDisplay)}.`:" Contact details have not been added yet."}</div>`;return}
const b=fm.querySelector("button");b.disabled=true;b.textContent="Sending…";
try{const r=await fetch(CONFIG.endpoint,{method:"POST",headers:{"Content-Type":"application/json","Accept":"application/json"},body:JSON.stringify(rec)});if(!r.ok)throw 0;fm.reset();res.innerHTML=`<div class="ok"><strong>Request received.</strong> This is a visit request, not a confirmed reservation. Our team will contact you to confirm.</div>`}
catch(e){res.innerHTML=`<div class="bad"><strong>Not sent.</strong> Please try again${CONFIG.phoneDisplay?" or call "+esc(CONFIG.phoneDisplay):""}.</div>`}b.disabled=false;b.textContent="Send visit request"}
const V={
home(){return `<section class="hero"><img class="hbg" src="${img("living")}" alt=""><div class="hshade"></div><span class="dm">Demo illustration: replace with photography</span><div class="wrap hc"><h1>Find Your Perfect Home at Dharma Tower.</h1><p>Thoughtfully furnished spaces. Everyday comfort. A place to call home.</p><div class="cta"><a class="btn" href="#/flats">Explore Our Flats</a><a class="btn g" href="#/contact">Book a Visit</a></div></div></section>

<section class="sec"><div class="wrap"><h2>Furnished flats</h2><p class="mt" style="max-width:50ch">Listings below are sample data. Rents, specifications and availability are placeholders until management supplies verified details.</p><div class="fg" style="margin-top:34px">${FLATS.slice(0,3).map(card).join("")}</div><p style="margin-top:34px"><a class="btn o" href="#/flats">See all flats</a></p></div></section>
<section class="sec sf"><div class="wrap why"><h2>Why choose Dharma Tower</h2><dl><dt>Furnished living spaces</dt><dd>Every listing states which furniture and appliances come with the flat.</dd><dt>Comfortable, practical interiors</dt><dd>Flats are presented with real photographs and clear room-by-room detail once supplied.</dd><dt>A simple enquiry process</dt><dd>Send a visit request online, or call or message us directly.</dd><dt>Personal assistance</dt><dd>Our team answers your questions and confirms visits and availability by phone.</dd><dt>A welcoming home</dt><dd>We want every tenant to feel settled from the first day.</dd></dl></div></section>
<section class="sec"><div class="wrap"><h2>Inside Dharma Tower</h2><div class="ed" style="margin-top:34px">${figs(GALLERY.slice(0,5),1)}</div><p style="margin-top:30px"><a class="btn o" href="#/gallery">Open the gallery</a></p></div></section>
<section class="sec sf"><div class="wrap two"><div><h2>Plan your visit</h2><p>Tell us what you are looking for and when you would like to move in. We will get back to you to confirm a time.</p></div>${form()}</div></section>`},
flats(){const r=FLATS.filter(f=>(!S.beds||f.beds==S.beds)&&(!S.budget||f.rent<=+S.budget));return `<section class="sec pg"><div class="wrap"><h1 style="font-size:clamp(2.4rem,6vw,4rem)">Flats</h1><form class="sp" style="margin:0 0 40px;max-width:none" id="fs"><div><label for="s1">Preferred move-in date</label><input id="s1" type="date" value="${esc(S.move)}"></div><div><label for="s2">Bedrooms</label><select id="s2"><option value="">Any</option>${[1,2,3].map(n=>`<option ${S.beds==n?"selected":""}>${n}</option>`).join("")}</select></div><div><label for="s3">Monthly budget</label><select id="s3"><option value="">Any</option>${[20000,30000,40000].map(n=>`<option value="${n}" ${S.budget==n?"selected":""}>Up to ${inr(n)}</option>`).join("")}</select></div><button class="btn" type="submit">Search Flats</button></form><p class="mt" aria-live="polite">${r.length} of ${FLATS.length} sample flats shown</p><div class="fg">${r.map(card).join("")||"<p>No flats match. Widen your search or <a href='#/contact'>contact us</a>.</p>"}</div></div></section>`},
flat(id){const f=FLATS.find(x=>x.id===id);if(!f)return `<section class="sec pg"><div class="wrap"><h1>Flat not found</h1><a class="btn" href="#/flats">View all flats</a></div></section>`;const p=fph(f);LB=p.map((s,i)=>({src:s,l:f.id+" photo "+(i+1)}));
return `<section class="sec pg"><div class="wrap"><a href="#/flats">← All flats</a><div class="two" style="margin-top:20px"><div><div class="gal">${p.map((s,i)=>`<img src="${s}" alt="${esc(f.id)} photo ${i+1}, demo image" data-lb="${i}" tabindex="0">`).join("")}</div><h1 style="font-size:clamp(2.2rem,5vw,3.6rem);margin-top:30px">${esc(f.type)} · ${esc(f.id)}</h1><p>${esc(f.desc)}</p><p class="pr">${inr(f.rent)} <small>/ month (sample) · deposit ${inr(f.deposit)} (sample)</small></p><p class="mt">${esc(f.furn)} · ${f.beds} bedroom · ${f.baths} bathroom · ${f.area?f.area+" sq ft carpet":"carpet area to be confirmed"} · ${f.verified?"Available":"availability to be confirmed"}</p>
<h3>Furniture and appliances</h3><ul class="am">${f.items.map(x=>`<li>${esc(x)} <span class="ph">sample</span></li>`).join("")}</ul><h3>Building amenities</h3>${AMEN.length?`<ul class="am">${AMEN.map(x=>`<li>${esc(x)}</li>`).join("")}</ul>`:`<p class="mt">To be confirmed by management.</p>`}<h3>Rental terms</h3><ul class="am">${TERMS.map(x=>`<li>${esc(x)}</li>`).join("")}</ul></div><div id="enq" style="position:sticky;top:96px"><h3>Enquire about ${esc(f.id)}</h3>${form(f.id)}</div></div></div></section>`},
gallery(){LB=GALLERY;return `<section class="sec pg"><div class="wrap"><h1 style="font-size:clamp(2.4rem,6vw,4rem)">Gallery</h1><p class="mt">Demo illustrations. Add real photographs in the GALLERY list.</p><div class="mas" style="margin-top:30px">${figs(GALLERY)}</div></div></section>`},
contact(){return `<section class="sec pg"><div class="wrap"><h1 style="font-size:clamp(2.4rem,6vw,4rem)">Visit &amp; Contact</h1><div style="max-width:640px"><div>${form()}</div><div style="margin-top:28px"><div class="pn"><p><strong>Phone</strong><br>${CONFIG.phone?`<a href="${tel()}">${esc(CONFIG.phoneDisplay||CONFIG.phone)}</a>`:`<span class="ph">To be confirmed</span>`}</p><p><strong>Address</strong><br>${CONFIG.address?esc(CONFIG.address):`<span class="ph">To be confirmed</span>`}</p><p><strong>Office hours</strong><br>${CONFIG.hours?esc(CONFIG.hours):`<span class="ph">To be confirmed</span>`}</p><a class="btn callb" href="${tel()}">Call Now</a></div><div class="map" style="margin-top:20px">${CONFIG.mapEmbedUrl?`<iframe src="${esc(CONFIG.mapEmbedUrl)}" title="Map" style="border:0;width:100%;height:320px;border-radius:16px" loading="lazy"></iframe>`:`<p>The map and directions will appear here once the building address is confirmed.</p>`}</div></div></div></div></section>`},
legal(){return `<section class="sec pg"><div class="wrap" style="max-width:760px"><h1 style="font-size:3rem">Privacy &amp; Terms</h1><p class="ph">Placeholder: replace with text reviewed by a legal professional.</p><p>We use the details you submit only to respond to your enquiry. Listings may change. A visit request is not a reservation; a flat is reserved only when management confirms it.</p></div></section>`}};
function route(){const[p,rest]=(location.hash.replace(/^#\/?/,"")||"home").split("/");const[a]=(rest||"").split("?");const k=V[p]?p:"home";
app.innerHTML=V[k](a);document.querySelectorAll("nav a[data-r]").forEach(x=>x.classList.toggle("on",x.dataset.r===k));$("#nav").classList.remove("open");$("#mb").setAttribute("aria-expanded","false");
if(k==="home"||k==="gallery")LB=k==="home"?GALLERY.slice(0,5):GALLERY;
document.title=({flats:"Flats",gallery:"Gallery",contact:"Visit & Contact",legal:"Privacy & Terms",flat:(a||"Flat")})[k]?({flats:"Flats",gallery:"Gallery",contact:"Visit & Contact",legal:"Privacy & Terms",flat:(a||"Flat")})[k]+" | Dharma Tower":"Dharma Tower | Furnished Flats for Rent";
scrollTo(0,0);if(location.hash.includes("?e=1"))setTimeout(()=>$("#enq")?.scrollIntoView({behavior:"smooth"}),50);obs();hd()}
function hd(){const h=$("#hd"),home=!location.hash||location.hash==="#/";h.classList.toggle("solid",!home||scrollY>60)}
function obs(){const els=document.querySelectorAll(".rv");if(!("IntersectionObserver"in window)){els.forEach(e=>e.classList.add("in"));return}const o=new IntersectionObserver(es=>es.forEach(e=>{if(e.isIntersecting){e.target.classList.add("in");o.unobserve(e.target)}}),{threshold:.1});els.forEach(e=>o.observe(e))}
document.addEventListener("submit",e=>{e.preventDefault();const f=e.target;if(f.classList.contains("enq"))submit(f);else if(f.id==="sp"||f.id==="fs"){S.move=$("#s1").value;S.beds=$("#s2").value;S.budget=$("#s3").value;if(location.hash==="#/flats")route();else location.hash="#/flats"}});
document.addEventListener("click",e=>{const g=e.target.closest("[data-lb]");if(g)showLb(+g.dataset.lb)});
document.addEventListener("keydown",e=>{if(e.key==="Enter"&&e.target.dataset?.lb)showLb(+e.target.dataset.lb);if(lb.open){if(e.key==="ArrowRight")showLb(li+1);if(e.key==="ArrowLeft")showLb(li-1)}});
$("#lp").onclick=()=>showLb(li-1);$("#ln").onclick=()=>showLb(li+1);
$("#mb").onclick=()=>{const o=$("#nav").classList.toggle("open");$("#mb").setAttribute("aria-expanded",o)};
document.querySelectorAll(".callb").forEach(a=>a.href=tel());$("#wa").href=wa();
$("#fc").innerHTML=(CONFIG.phone?`<a href="${tel()}">${esc(CONFIG.phoneDisplay||CONFIG.phone)}</a>`:"")+(CONFIG.address?`<p>${esc(CONFIG.address)}</p>`:`<p>Contact details will be added once confirmed.</p>`);$("#yr").textContent=new Date().getFullYear();
addEventListener("scroll",hd,{passive:true});addEventListener("hashchange",route);route();
</script></body></html>
